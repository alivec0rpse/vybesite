# Build and deploy vybe.net.in to Azure Static Web Apps on every push to main.
#
# Uses the SWA CLI rather than Azure/static-web-apps-deploy@v1: that action
# calls GitHub's API for commit statuses and PR preview environments, which a
# Gitea runner has nowhere to send.
#
# One job, deliberately. build -> CDN -> deploy is a strict sequence, and
# every extra job pays a container start, a checkout and an npm install before
# it does anything; the API tests take two seconds once api/ is installed.
#
# Most of a run used to be installing tools, not building (the build is a few
# seconds). So the CDN upload is a Node script that sends only changed files,
# instead of the Azure CLI installed from scratch on every run.
#
# Required secrets (Settings -> Actions -> Secrets):
#   AZURE_STATIC_WEB_APPS_API_TOKEN
#   AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID
#
# The order-tracking API in api/ ships in the same deploy, as the site's
# managed functions. Its own settings (VYB_TABLES_CONNECTION,
# VYB_SESSION_SECRET, VYB_ADMIN_EMAIL, VYB_ADMIN_PASSWORD) are not secrets
# here: they live on the Static Web App itself, under Settings -> Environment
# variables, so CI never holds the database key. See README.md.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
    # Nothing in these reaches the site, so a push touching only them is not
    # worth a deploy. Any other file in the same push still triggers one.
    paths-ignore:
      - 'README.md'
      - 'shots/**'
      - 'employee-ids/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # tools/indexnow.mjs diffs .lastmod.json against HEAD~1.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No `cache: npm`. On this runner the job container cannot reach the
          # act_runner cache server, and the restore waited minutes for a
          # timeout before giving up. Re-enable only once the runner's
          # cache.host is reachable from inside jobs.

      - name: Install dependencies
        # Puppeteer only drives the local screenshot scripts; skip the 170MB
        # Chromium download CI never opens.
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --no-audit --no-fund
          # The SWA CLI uploads api/ as it is and does not build it, so it has
          # to carry its node_modules. Production dependencies only.
          npm ci --prefix api --omit=dev --no-audit --no-fund

      - name: Test the API
        # The handlers run against an in-memory table: no Azure credentials,
        # and the failure stops the run before anything is published.
        run: npm test --prefix api

      - name: Build
        run: npm run build

      - name: Validate HTML
        # Between build and deploy, so a malformed page fails the run rather
        # than reaching production.
        run: npm run validate

      - name: Stage the deploy artifact
        run: npm run stage

      - name: Upload changed assets to the CDN origin
        # Before the site deploy, never after: the staged pages reference
        # cdn.vybe.net.in, so an asset missing from the container is a 404 on a
        # live page for the length of the deploy.
        #
        # No purge follows. Every asset URL carries a ?v=<content hash> and the
        # Front Door route caches on the full query string, so changed content
        # lands under a new cache key.
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: node tools/cdn-upload.mjs

      - name: Deploy to Azure
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_CLI_DEPLOYMENT_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set."
            echo "Add it under Settings -> Actions -> Secrets in this repository."
            exit 1
          fi
          npx --yes @azure/static-web-apps-cli@2 deploy ./dist \
            --deployment-token "$SWA_CLI_DEPLOYMENT_TOKEN" \
            --env production \
            --swa-config-location ./dist \
            --api-location ./api \
            --api-language node \
            --api-version 22 \
            --no-use-keychain

      - name: Ping IndexNow
        # After the deploy: the engines fetch as soon as they are told, and
        # pointing them at stale content is worse than staying quiet. A hint,
        # not a gate, so a 429 does not fail a good deploy.
        continue-on-error: true
        run: npm run indexnow
