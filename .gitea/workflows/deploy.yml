# Build and deploy vybe.net.in to Azure Static Web Apps on every push to main.
#
# Uses the SWA CLI rather than Azure/static-web-apps-deploy@v1: that action
# calls GitHub's API for commit statuses and PR preview environments, which a
# Gitea runner has nowhere to send.
#
# Required secrets (Settings -> Actions -> Secrets):
#   AZURE_STATIC_WEB_APPS_API_TOKEN
#   AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # tools/indexnow.mjs diffs .lastmod.json against HEAD~1.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Puppeteer only drives the local screenshot scripts; skip the 170MB
        # Chromium download CI never opens.
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate HTML
        # Between build and deploy, so a malformed page fails the run rather
        # than reaching production.
        run: npm run validate

      - name: Stage the deploy artifact
        run: npm run stage

      - name: Upload assets to the CDN origin
        # Before the site deploy, never after: the staged pages reference
        # cdn.vybe.net.in, so an asset missing from the container is a 404 on a
        # live page for the length of the deploy.
        #
        # No purge follows. Every asset URL carries a ?v=<content hash> and the
        # Front Door route caches on the full query string, so changed content
        # lands under a new cache key.
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            if [ -z "$(eval echo \$$v)" ]; then
              echo "$v is not set."
              echo "Add it under Settings -> Actions -> Secrets in this repository."
              exit 1
            fi
          done
          command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          # --allow-no-subscriptions: the principal is scoped to one storage
          # account and cannot enumerate subscriptions.
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --allow-no-subscriptions --output none
          az storage blob upload-batch \
            --account-name vybecdn --auth-mode login \
            --destination '$web' --destination-path assets \
            --source ./dist/assets \
            --overwrite --no-progress \
            --content-cache 'public, max-age=31536000, immutable'
          # Re-upload the fonts with an explicit type: the CLI has no entry for
          # .woff2 and they would land as application/octet-stream.
          az storage blob upload-batch \
            --account-name vybecdn --auth-mode login \
            --destination '$web' --destination-path assets \
            --source ./dist/assets \
            --pattern '**/*.woff2' \
            --overwrite --no-progress \
            --content-type 'font/woff2' \
            --content-cache 'public, max-age=31536000, immutable'

      - name: Deploy to Azure
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_CLI_DEPLOYMENT_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set."
            echo "Add it under Settings -> Actions -> Secrets in this repository."
            exit 1
          fi
          npx --yes @azure/static-web-apps-cli@2 deploy ./dist \
            --deployment-token "$SWA_CLI_DEPLOYMENT_TOKEN" \
            --env production \
            --swa-config-location ./dist \
            --no-use-keychain

      - name: Ping IndexNow
        # After the deploy: the engines fetch as soon as they are told, and
        # pointing them at stale content is worse than staying quiet. A hint,
        # not a gate, so a 429 does not fail a good deploy.
        continue-on-error: true
        run: npm run indexnow
